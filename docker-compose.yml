version: '3'

services: 
  backend:
    # Name the service container
    image: db-for-odoo-service
    container_name: db-for-odoo-service
    build: ./
    restart: on-failure

    volumes:
      - ./:/webapps/service
      - /var/log/apps/:/var/log/apps/

    ports:
      - "5011:5005"

    networks:
     - same-network

    command: supervisord -n -c /etc/supervisor.d/supervisord.conf
    extra_hosts:
      - "dev2-tiktik-com.cloud.local:203.205.21.196"
      
  # workers:
  #   # Name the service container
  #   image: db-for-odoo-worker-service
  #   container_name: db-for-odoo-worker-service
  #   build: ./
  #   restart: on-failure
  #   volumes:
  #     - ./:/webapps/service
  #     - /var/log/apps/:/var/log/apps/
  #   networks:
  #     - same-network

  #   command: supervisord -n -c /etc/supervisor.d/worker-supervisord.conf
  #   extra_hosts:
  #     - "dev2-tiktik-com.cloud.local:203.205.21.196"
networks:
  same-network:
    external: true
